; Countdown timer for M5StickC PLUS SE, with a distributed fanfare.
;
; The StickC, StickC Plus and StickC Plus SE are all ESP32-PICO-D4 with 4 MB
; flash, so they share one build configuration entirely - M5Unified identifies
; the actual device at runtime by probing I2C and the panel. Only the S3 needs
; a separate environment.
;
; The StickC Plus 1.1 is a near-exact proxy for the SE: same board ID, same
; 135x240 ST7789v2 panel, same BM8563 RTC, same AXP192, same buzzer on G2. It
; even autodetects as board_M5StickCPlus, which is what the SE reports too.
; Everything including the fanfare can be developed and tested on it.

[platformio]
default_envs = stick

[env]
framework = arduino

; M5Unified and M5GFX lean on conditional includes that the default LDF mode
; cannot see. Matches m5stack/M5StickC-Plus-SE-Factory.
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.15.5
    m5stack/M5Unified @ ^0.2.21
    m5stack/M5GFX @ ^0.2.28

extra_scripts = pre:scripts/load_env.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags = -DCORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; ESP32-PICO-D4 sticks: StickC / StickC Plus / StickC Plus SE
;
; Platform pinned to match M5Stack's own factory firmware for the SE.
; ---------------------------------------------------------------------------
[env:stick]
platform = espressif32@6.12.0
board = m5stick-c
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
upload_speed = 1500000

; ---------------------------------------------------------------------------
; M5StickS3 (ESP32-S3) - best effort.
;
; There is no published PlatformIO board JSON for the StickS3, so this borrows
; a generic S3 devkit definition. The Arduino core also needs to be 3.x, hence
; the pioarduino fork. Unverified: confirm flash size and PSRAM against your
; unit before trusting it.
; ---------------------------------------------------------------------------
[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
