<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">M5StickC PLUS SE Grove connector to one or two NeoPixels</title>
  <desc id="description">A level-shifted five volt NeoPixel circuit using GPIO32 by default, with GPIO33 as an alternative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #17212b; }
      .subtitle { font: 16px 'Segoe UI', sans-serif; fill: #44515c; }
      .heading { font: 700 20px 'Segoe UI', sans-serif; fill: #17212b; }
      .label { font: 16px 'Segoe UI', sans-serif; fill: #17212b; }
      .small { font: 14px 'Segoe UI', sans-serif; fill: #44515c; }
      .pin { font: 600 15px 'Segoe UI', sans-serif; fill: #17212b; }
      .component { fill: #f7f9fb; stroke: #34495e; stroke-width: 2; }
      .pixel { fill: #eef8f4; stroke: #24735e; stroke-width: 2; }
      .optional-box { fill: #fafafa; stroke: #78838c; stroke-width: 2; stroke-dasharray: 8 6; }
      .wire { fill: none; stroke: #25313b; stroke-width: 4; stroke-linejoin: round; }
      .signal { fill: none; stroke: #1769aa; stroke-width: 4; stroke-linejoin: round; }
      .alternate { fill: none; stroke: #d28a00; stroke-width: 3; stroke-dasharray: 9 7; }
      .power { fill: none; stroke: #c62828; stroke-width: 5; stroke-linejoin: round; }
      .ground { fill: none; stroke: #25313b; stroke-width: 5; stroke-linejoin: round; }
      .node { fill: #25313b; }
      .power-node { fill: #c62828; }
      .note { fill: #fff8df; stroke: #b68a18; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="50" y="55" class="title">Grove to one or two NeoPixels</text>
  <text x="50" y="84" class="subtitle">M5StickC PLUS SE, 5 V pixels, robust 3.3 V to 5 V data path</text>

  <!-- Main power rails -->
  <path d="M 330 145 H 1535" class="power"/>
  <text x="345" y="132" class="pin" fill="#c62828">+5 V</text>
  <path d="M 330 690 H 1535" class="ground"/>
  <text x="345" y="720" class="pin">GND</text>

  <!-- Grove connector -->
  <rect x="50" y="235" width="230" height="285" rx="6" class="component"/>
  <text x="165" y="272" text-anchor="middle" class="heading">J1 HY2.0-4P</text>
  <text x="165" y="297" text-anchor="middle" class="small">StickC PLUS SE Grove</text>

  <line x1="220" y1="340" x2="280" y2="340" class="alternate"/>
  <circle cx="220" cy="340" r="5" fill="#d28a00"/>
  <text x="70" y="346" class="pin">4  GPIO33</text>
  <text x="70" y="365" class="small">yellow, alternate</text>

  <line x1="220" y1="400" x2="520" y2="400" class="signal"/>
  <circle cx="220" cy="400" r="5" fill="#1769aa"/>
  <text x="70" y="406" class="pin">3  GPIO32</text>
  <text x="70" y="425" class="small">white, default DATA</text>

  <path d="M 220 460 H 330 V 145" class="power"/>
  <circle cx="220" cy="460" r="5" class="power-node"/>
  <text x="70" y="466" class="pin">2  +5 V</text>
  <text x="70" y="485" class="small">red</text>

  <path d="M 220 510 H 330 V 690" class="ground"/>
  <circle cx="220" cy="510" r="5" class="node"/>
  <text x="70" y="516" class="pin">1  GND</text>
  <text x="70" y="535" class="small">black</text>

  <path d="M 280 340 H 415" class="alternate"/>
  <line x1="405" y1="330" x2="425" y2="350" stroke="#d28a00" stroke-width="3"/>
  <line x1="425" y1="330" x2="405" y2="350" stroke="#d28a00" stroke-width="3"/>
  <text x="292" y="319" class="small" fill="#9a6500">ALT data: LED_PIN=33</text>

  <!-- Bulk capacitor -->
  <path d="M 390 145 V 225" class="power"/>
  <line x1="366" y1="225" x2="414" y2="225" stroke="#25313b" stroke-width="4"/>
  <line x1="366" y1="242" x2="414" y2="242" stroke="#25313b" stroke-width="4"/>
  <path d="M 390 242 V 690" class="ground"/>
  <text x="423" y="224" class="pin">C1 1000 uF</text>
  <text x="423" y="245" class="small">6.3 V or higher</text>
  <text x="370" y="210" class="heading" fill="#c62828">+</text>

  <!-- Level shifter -->
  <rect x="520" y="300" width="230" height="210" rx="6" class="component"/>
  <text x="635" y="335" text-anchor="middle" class="heading">U1A 74AHCT125</text>
  <text x="544" y="392" class="pin">2  1A</text>
  <text x="681" y="392" class="pin">1Y  3</text>
  <line x1="520" y1="400" x2="570" y2="400" class="signal"/>
  <path d="M 570 365 L 690 400 L 570 435 z" fill="#ffffff" stroke="#34495e" stroke-width="3"/>
  <circle cx="705" cy="400" r="7" fill="#ffffff" stroke="#34495e" stroke-width="3"/>
  <line x1="712" y1="400" x2="750" y2="400" class="signal"/>
  <text x="548" y="475" class="pin">1  /1OE</text>
  <path d="M 590 460 V 690" class="ground"/>
  <circle cx="590" cy="460" r="5" class="node"/>
  <path d="M 635 300 V 145" class="power"/>
  <text x="648" y="289" class="small">14 VCC</text>
  <path d="M 675 510 V 690" class="ground"/>
  <text x="687" y="503" class="small">7 GND</text>

  <!-- U1 decoupling capacitor -->
  <path d="M 785 145 V 250" class="power"/>
  <line x1="764" y1="250" x2="806" y2="250" stroke="#25313b" stroke-width="4"/>
  <line x1="764" y1="266" x2="806" y2="266" stroke="#25313b" stroke-width="4"/>
  <path d="M 785 266 V 690" class="ground"/>
  <text x="812" y="252" class="pin">C2 100 nF</text>
  <text x="812" y="273" class="small">at U1 pins 14/7</text>

  <!-- Data resistor -->
  <line x1="750" y1="400" x2="820" y2="400" class="signal"/>
  <path d="M 820 400 l 12 -14 l 18 28 l 18 -28 l 18 28 l 18 -28 l 12 14" class="signal"/>
  <line x1="916" y1="400" x2="985" y2="400" class="signal" marker-end="url(#arrow)"/>
  <text x="838" y="369" class="pin">R1 330 ohm</text>
  <text x="818" y="440" class="small">Place close to D1 DIN</text>

  <!-- Pixel 1 -->
  <rect x="995" y="270" width="215" height="245" rx="8" class="pixel"/>
  <text x="1103" y="310" text-anchor="middle" class="heading">D1 NeoPixel</text>
  <text x="1103" y="335" text-anchor="middle" class="small">WS2812-compatible</text>
  <text x="1012" y="393" class="pin">DIN</text>
  <text x="1142" y="393" class="pin">DOUT</text>
  <line x1="985" y1="400" x2="1032" y2="400" class="signal"/>
  <line x1="1172" y1="400" x2="1210" y2="400" class="signal"/>
  <path d="M 1065 270 V 145" class="power"/>
  <text x="1078" y="260" class="small">VDD</text>
  <path d="M 1065 515 V 690" class="ground"/>
  <text x="1078" y="542" class="small">GND</text>

  <!-- Pixel 1 decoupling -->
  <path d="M 1240 145 V 235" class="power"/>
  <line x1="1220" y1="235" x2="1260" y2="235" stroke="#25313b" stroke-width="4"/>
  <line x1="1220" y1="251" x2="1260" y2="251" stroke="#25313b" stroke-width="4"/>
  <path d="M 1240 251 V 690" class="ground"/>
  <text x="1190" y="216" class="pin">C3 100 nF</text>
  <text x="1170" y="586" class="small">Omit if built into module</text>

  <!-- Optional pixel 2 -->
  <rect x="1295" y="270" width="215" height="245" rx="8" class="optional-box"/>
  <text x="1403" y="310" text-anchor="middle" class="heading">D2 optional</text>
  <text x="1403" y="335" text-anchor="middle" class="small">second NeoPixel</text>
  <text x="1312" y="393" class="pin">DIN</text>
  <text x="1442" y="393" class="pin">DOUT</text>
  <line x1="1210" y1="400" x2="1332" y2="400" class="signal" marker-end="url(#arrow)"/>
  <line x1="1472" y1="400" x2="1530" y2="400" class="signal"/>
  <text x="1490" y="387" class="small">NC</text>
  <path d="M 1365 270 V 145" class="power"/>
  <text x="1378" y="260" class="small">VDD</text>
  <path d="M 1365 515 V 690" class="ground"/>
  <text x="1378" y="542" class="small">GND</text>

  <!-- Pixel 2 decoupling -->
  <path d="M 1535 145 V 235" class="power"/>
  <line x1="1515" y1="235" x2="1555" y2="235" stroke="#25313b" stroke-width="4"/>
  <line x1="1515" y1="251" x2="1555" y2="251" stroke="#25313b" stroke-width="4"/>
  <path d="M 1535 251 V 690" class="ground"/>
  <text x="1460" y="216" class="pin">C4 100 nF</text>

  <!-- Build notes -->
  <rect x="50" y="760" width="1500" height="95" rx="6" class="note"/>
  <text x="75" y="792" class="heading">Assembly notes</text>
  <text x="75" y="820" class="label">Use only one data wire. For one pixel, omit D2 and C4 and leave D1 DOUT open. Power pixels in parallel; chain data DOUT to DIN.</text>
  <text x="75" y="844" class="label">Unused 74AHCT125 gates: tie /OE pins 4, 10, 13 to +5 V; tie A pins 5, 9, 12 to GND; leave Y pins 6, 8, 11 open.</text>
</svg>